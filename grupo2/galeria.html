<body>
  <nav class="navbar">
    <div class="container nav-wrap">
      <a href="pagina.html" class="logo">Dictadura Militar</a>
      <ul class="nav-links">
        <li><a href="pagina.html">Inicio</a></li>
        <li><a href="información.html">Información</a></li>
        <li><a href="galeria.html">Galería</a></li>
      </ul>

  <main class="container section">
    <h2>Galería</h2>
    <p class="section-intro">
      Imágenes que recuerdan la historia, la resistencia y el impacto de la dictadura
      militar sobre la sociedad argentina.
    </p>

    <div class="gallery-grid">
      <figure class="gallery-item" data-desc="Pancartas y movilización en la búsqueda de verdad y memoria.">
        <img src="nunca-mas.jpg" alt="Nunca Más" />
        <div class="overlay"><p>Pancartas y movilización en la búsqueda de verdad y memoria.</p></div>
        <figcaption>¡Nunca más! — Movilización por la memoria.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Las Abuelas de Plaza de Mayo recorriendo plazas y tribunales en busca de nietos desaparecidos.">
        <img src="abuelas.jpg" alt="Abuelas de Plaza de Mayo" />
        <div class="overlay"><p>Las Abuelas de Plaza de Mayo recorriendo plazas y tribunales en busca de nietos desaparecidos.</p></div>
        <figcaption>Abuelas de Plaza de Mayo — Búsqueda de identidad.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Imágenes de la represión: censura, detenidos y operativos represivos.">
        <img src="represion.jpg" alt="Represión" />
        <div class="overlay"><p>Imágenes de la represión: censura, detenidos y operativos represivos.</p></div>
        <figcaption>Represión y censura — Testimonios gráficos.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Imagen histórica de la Junta militar que gobernó durante el período.">
        <img src="videla y compañia.jpg" alt="Videla y la Junta" />
        <div class="overlay"><p>Imagen histórica de la Junta militar que gobernó durante el período.</p></div>
        <figcaption>Videla y la Junta — Autoritarismo estatal.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Noches y operativos que marcaron el clima de terror social.">
        <img src="NOCHE.jpg" alt="Noche de terror" />
        <div class="overlay"><p>Noches y operativos que marcaron el clima de terror social.</p></div>
        <figcaption>Noche de miedo — Historias de terror.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Control ideológico: quema de libros y censura cultural.">
        <img src="quema.jpg" alt="Quema de libros" />
        <img src="1polis.jpg" alt="Policias reprimiendo al pueblo" />
        <div class="overlay"><p>Fuerzas de seguridad reprimiendo y golpeando a manifestantes durante una jornada de protesta en la calle.</p></div>
        <figcaption>¡Nunca más! — Movilización por la memoria.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Las Abuelas de Plaza de Mayo recorriendo plazas y tribunales en busca de nietos desaparecidos.">
        <img src="2videla.jpg" alt="VIDELA" />
        <div class="overlay"><p>Retrato del dictador Jorge Rafael Videla en una portada conmemorativa sobre el golpe de Estado de 1976.</p></div>
        <figcaption>Abuelas de Plaza de Mayo — Búsqueda de identidad.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Imágenes de la represión: censura, detenidos y operativos represivos.">
        <img src="Lamarchadelpueblo.jpg" alt="Represión" />
        <div class="overlay"><p>Una multitud de trabajadores manifestándose en las calles con los brazos en alto en señal de protesta y reclamo laboral.</p></div>
        <figcaption>Represión y censura — Testimonios gráficos.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Imagen histórica de la Junta militar que gobernó durante el período.">
        <img src="50 años.jpg" alt="aniversareio de los 50 años" />
        <div class="overlay"><p>Imagen institucional con militares al mando bajo el título conmemorativo sobre la última dictadura militar en Argentina.</p></div>
        <figcaption>Videla y la Junta — Autoritarismo estatal.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Noches y operativos que marcaron el clima de terror social.">
        <img src="4isa.jpg" alt="isabela de Peron" />
        <div class="overlay"><p>Portadas de diarios históricos anunciando el derrocamiento de Isabel Perón y la asunción de la Junta Militar.</p></div>
        <figcaption>Noche de miedo — Historias de terror.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Control ideológico: quema de libros y censura cultural.">
        <img src="desaparecidos.jpg" alt="los desaparesidos de la dictadura" />
        <div class="overlay"><p>Obra artística representativa con huellas dactilares y las siglas "N.N." que alude a las personas desaparecidas.</p></div>
        <figcaption>Control ideológico — Censura cultural.</figcaption>
      </figure>
      <figure class="gallery-item" data-desc="Control ideológico: quema de libros y censura cultural.">
        <img src="fallecidos.jpg" alt="los fallecidos de la dictadura" />
        <div class="overlay"><p>Ilustración simbólica sobre los "vuelos de la muerte" que muestra siluetas humanas cayendo al mar con la frase "Nunca más".</p></div>
        <figcaption>Control ideológico — Censura cultural.</figcaption>
      </figure>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Recordar para no repetir.</p>
    </div>
  </footer>
</body>
